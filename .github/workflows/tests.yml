name: Tests

on:
  push:
    branches: [ main, master, a4-arena ]
  pull_request:
    branches: [ main, master, a4-arena ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Typer forces ANSI output when GITHUB_ACTIONS is set (typer/rich_utils.py,
      # FORCE_TERMINAL). Disable that forcing so captured CLI output is plain text.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install project (provides the sentinel entry point)
        run: pip install .

      - name: Run tests
        run: pytest --tb=short -q
