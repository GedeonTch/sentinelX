name: Tests

on:
  push:
    branches: [ main, master, a4-arena ]
  pull_request:
    branches: [ main, master, a4-arena ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install project (provides the sentinel entry point)
        run: pip install .

      - name: Run tests
        run: pytest --tb=short -q
