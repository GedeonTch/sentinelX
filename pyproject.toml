[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX network audit and Sentinel monitoring CLI"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
sentinel = "sentinel.command:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["core*", "sentinel*", "detect*", "recon*", "reports*", "knowledge*", "cleanup*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
knowledge = ["*.json"]
reports = ["templates/*.html", "assets/*.png"]
